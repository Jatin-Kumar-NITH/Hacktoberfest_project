plugins {
    id "com.android.application"
}

// The site the app opens. Keep in sync with ANDROID_PACKAGE in app.py and the
// fingerprint served at https://campusmate-nith.vercel.app/.well-known/assetlinks.json
def siteHost = "campusmate-nith.vercel.app"
def siteUrl = "https://" + siteHost + "/?source=android"

android {
    namespace "app.vercel.campusmate_nith"
    compileSdk 35

    defaultConfig {
        applicationId "app.vercel.campusmate_nith"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        manifestPlaceholders = [hostName: siteHost, launchUrl: siteUrl]
        resValue "string", "asset_statements",
            "[{ \\\"relation\\\": [\\\"delegate_permission/common.handle_all_urls\\\"], " +
            "\\\"target\\\": { \\\"namespace\\\": \\\"web\\\", \\\"site\\\": \\\"https://" + siteHost + "\\\" } }]"
    }

    signingConfigs {
        // Shared debug key (android/debug.keystore) so every CI build can update
        // the previous one on a phone. Never put its fingerprint in assetlinks.
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Real key for the Play Store / full-screen app, supplied by CI secrets.
        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
