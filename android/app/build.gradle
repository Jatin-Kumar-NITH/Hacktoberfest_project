plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

// The server the app talks to. The app id must match ANDROID_PACKAGE in app.py.
def siteHost = "campusmate-nith.vercel.app"
// CI passes its run number so every build installs over the last one (and the app can spot updates).
def buildNumber = (System.getenv("APP_BUILD_NUMBER") ?: "0").toInteger()
def updateUrl = "https://github.com/Jatin-Kumar-NITH/Hacktoberfest_project/releases/download/android-latest/version.json"

android {
    namespace "app.vercel.campusmate_nith"
    compileSdk 35

    defaultConfig {
        applicationId "app.vercel.campusmate_nith"
        minSdk 26
        targetSdk 35
        versionCode(100 + buildNumber)
        versionName("2.1." + buildNumber)

        buildConfigField "String", "BASE_URL", "\"https://" + siteHost + "\""
        buildConfigField "String", "UPDATE_URL", "\"" + updateUrl + "\""
        manifestPlaceholders = [hostName: siteHost]
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        // Shared debug key (android/debug.keystore) so every CI build can update
        // the previous one on a phone. Its SHA-1 goes on the Android OAuth client.
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Real key for the Play Store, supplied by CI secrets.
        if (System.getenv("ANDROID_KEYSTORE_PATH")) {
            release {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom:2024.10.01")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.navigation:navigation-compose:2.8.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
