# Temporary: screenshots of the home-screen widget for the PR. Removed before merge.
name: Widget preview

on:
  pull_request:
    paths: ["android/**", ".github/workflows/widget-preview.yml"]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Sample campus data from data/
        run: |
          mkdir -p android/app/src/debug/assets
          python3 -c '
          import json
          L = lambda f: json.load(open("data/" + f))
          campus = {"timetables": {str(y): L(f"year{y}_timetable.json") for y in (1, 2, 3, 4)},
                    "hostel": L("hostel.json"), "calendar": L("academic_calendar.json")}
          json.dump({"campus": campus}, open("android/app/src/debug/assets/preview_campus.json", "w"))
          '

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -S -W -n app.vercel.campusmate_nith/.WidgetPreviewActivity --ez dark false
            sleep 5
            adb exec-out screencap -p > widget-light.png
            adb shell am start -S -W -n app.vercel.campusmate_nith/.WidgetPreviewActivity --ez dark true
            sleep 5
            adb exec-out screencap -p > widget-dark.png

      - name: Print screenshots into the log
        run: |
          pip install -q pillow
          python3 -c '
          import base64, io
          from PIL import Image, ImageChops
          for name in ("light", "dark"):
              im = Image.open(f"widget-{name}.png").convert("RGB")
              w, h = im.size
              body = im.crop((0, int(h * 0.05), w, int(h * 0.95)))
              bg = Image.new("RGB", body.size, body.getpixel((2, body.height // 2)))
              box = ImageChops.difference(body, bg).getbbox() or (0, 0, body.width, body.height)
              body = body.crop((max(box[0] - 20, 0), max(box[1] - 20, 0), min(box[2] + 20, body.width), min(box[3] + 20, body.height)))
              body.thumbnail((900, 1400))
              buf = io.BytesIO(); body.save(buf, "JPEG", quality=82)
              data = base64.b64encode(buf.getvalue()).decode()
              print(f"SHOT-BEGIN {name}")
              for i in range(0, len(data), 2000): print("SHOT " + data[i:i + 2000])
              print(f"SHOT-END {name}")
          '

      - uses: actions/upload-artifact@v4
        with:
          name: widget-preview
          path: widget-*.png
